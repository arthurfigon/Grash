<div class="lobby">
  <h1>Grash</h1>
  <p class="subtitle">Crie uma sala ou entre com um código para jogar em tempo real.</p>

  <label>
    Nickname
    <input
      type="text"
      [ngModel]="nickname()"
      (ngModelChange)="nickname.set($event)"
      maxlength="20"
      placeholder="Como quer ser chamado?"
    />
  </label>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="actions">
    <button (click)="createRoom()" [disabled]="loading()">Criar sala</button>

    <div class="join">
      <input
        type="text"
        [ngModel]="roomCode()"
        (ngModelChange)="roomCode.set($event)"
        maxlength="6"
        placeholder="Código da sala"
      />
      <button (click)="joinRoom()" [disabled]="loading()">Entrar</button>
    </div>
  </div>
</div>
