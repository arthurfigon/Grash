<div class="lobby">
  <h1>Grash</h1>
  <p class="subtitle">Um jogo no qual todos sabem a palavra-chave menos o impostor, você conseguirá descobrir quem é o impostor sem que ele descubra sua palavra-chave?</p>

  <label>
    Nickname
    <input
      type="text"
      [ngModel]="nickname()"
      (ngModelChange)="nickname.set($event)"
      maxlength="20"
      placeholder="Como quer ser chamado?"
    />
  </label>

  <label>
    Tema (só pra criar sala)
    <select [ngModel]="selectedTheme()" (ngModelChange)="selectedTheme.set($event)">
      <option value="">Aleatório</option>
      @for (theme of themes(); track theme) {
        <option [value]="theme">{{ theme }}</option>
      }
    </select>
  </label>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="actions">
    <button (click)="createRoom()" [disabled]="loading()">Criar sala</button>

    <div class="join">
      <input
        type="text"
        [ngModel]="roomCode()"
        (ngModelChange)="roomCode.set($event)"
        maxlength="6"
        placeholder="Código da sala"
      />
      <button (click)="joinRoom()" [disabled]="loading()">Entrar</button>
    </div>
  </div>
</div>
