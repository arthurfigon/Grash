# Blueprint da Render para o Grash: backend (Docker) + frontend (site estático).
# Sem banco de dados — o jogo é inteiramente em memória (ver ARCHITECTURE.md).
# As URLs abaixo assumem os nomes de serviço exatos "grash-backend" e
# "grash-frontend" (Render gera a URL pública como https://<nome>.onrender.com).
# Se algum nome já estiver em uso e você precisar trocar, atualize as duas
# pontas (envVars do outro serviço) para bater com o novo domínio.
services:
  - name: grash-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: GRASH_CORS_ALLOWED_ORIGINS
        value: https://grash-frontend.onrender.com

  - name: grash-frontend
    type: web
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/grash-frontend/browser
    envVars:
      - key: API_URL
        value: https://grash-backend.onrender.com/api
      - key: WS_URL
        value: https://grash-backend.onrender.com/ws
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
